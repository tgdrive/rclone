---
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '~1.27.0'

      - uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Set SDK directory
        run: echo "RELEASE_SDK_DIR=$RUNNER_TEMP/release-sdk" >> "$GITHUB_ENV"

      - name: Cache release SDKs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/release-sdk
          key: release-sdk-${{ runner.os }}-macos26.1-winfsp-ada6de1-macfuse-e9c0433

      - name: Prepare cross-compilation SDKs
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_SDK_DIR"
          if [[ ! -d "$RELEASE_SDK_DIR/winfsp" ]]; then
            git init "$RELEASE_SDK_DIR/winfsp"
            git -C "$RELEASE_SDK_DIR/winfsp" remote add origin https://github.com/winfsp/winfsp.git
            git -C "$RELEASE_SDK_DIR/winfsp" fetch --depth 1 origin ada6de157df4fa99f5a866b6ac7af66918d6d838
            git -C "$RELEASE_SDK_DIR/winfsp" checkout --detach FETCH_HEAD
          fi
          if [[ ! -d "$RELEASE_SDK_DIR/macfuse" ]]; then
            git init "$RELEASE_SDK_DIR/macfuse"
            git -C "$RELEASE_SDK_DIR/macfuse" remote add origin https://github.com/macfuse/library.git
            git -C "$RELEASE_SDK_DIR/macfuse" fetch --depth 1 origin e9c0433a0ef4694802474c82f47ca024a572153b
            git -C "$RELEASE_SDK_DIR/macfuse" checkout --detach FETCH_HEAD
          fi
          if [[ ! -d "$RELEASE_SDK_DIR/MacOSX26.1.sdk" ]]; then
            archive="$RELEASE_SDK_DIR/MacOSX26.1.sdk.tar.xz"
            curl --fail --location --retry 3 \
              https://github.com/joseluisq/macosx-sdks/releases/download/26.1/MacOSX26.1.sdk.tar.xz \
              --output "$archive"
            echo "beee7212d265a6d2867d0236cc069314b38d5fb3486a6515734e76fa210c784c  $archive" | sha256sum --check
            tar -xf "$archive" -C "$RELEASE_SDK_DIR"
          fi

      - name: Build and publish with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.1
          args: release --clean --parallelism 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux release archives for Docker
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: dist/rclone-*-linux-*.zip
          retention-days: 1

  docker:
    name: Build and push Docker images
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Linux release archives
        uses: actions/download-artifact@v8
        with:
          name: linux-artifacts
          path: build

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish Docker Plugin
        run: |
          VER=$GITHUB_REF_NAME
          PLUGIN_USER="ghcr.io/${{ github.repository_owner }}"
          for PLUGIN_ARCH in amd64 arm64 arm/v7; do
              export PLUGIN_ARCH
              export PLUGIN_USER
              make docker-plugin PLUGIN_TAG="${PLUGIN_ARCH/\//-}"
              make docker-plugin PLUGIN_TAG="${PLUGIN_ARCH/\//-}-${VER#v}"
          done
          make docker-plugin PLUGIN_ARCH=amd64 PLUGIN_TAG=latest
          make docker-plugin PLUGIN_ARCH=amd64 PLUGIN_TAG="${VER#v}"
